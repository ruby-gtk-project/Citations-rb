[workspace]
members = ["cratebibtex", "texer"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"
authors = ["Maximiliano Sandoval <msandova@gnome.org>"]

[workspace.dependencies]
anyhow = "1"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
log = "0.4"
texer = { path = "texer" }

adw = { package = "libadwaita", version = "0.9.1", features = ["v1_8"] }
cairo-rs = { version = "0.22", features = ["png"] }
gio = "0.22"
glib = "0.22"
gsv = { package = "sourceview5", version = "0.11" }
gtk = { version = "0.11", package = "gtk4", features = ["gnome_47", "v4_24"] }
poppler-rs = { version = "0.26", features = ["v0_82"] }

[package]
name = "citations"
version = "0.6.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[profile.release]
lto = true

[dependencies]
adw.workspace = true
anyhow.workspace = true
cairo-rs.workspace = true
cratebibtex = { path = "cratebibtex" }
formatx = "0.4"
texer.workspace = true
doi2bib = "0.3"
futures-channel = "0.3"
gettext-rs.workspace = true
gsv.workspace = true
gtk.workspace = true
log.workspace = true
poppler-rs.workspace = true
reqwest = "0.13"
sanitize-filename = "0.6"
tokio = { version = "1.36", default-features = false, features = ["rt-multi-thread"] }
tracing-subscriber = "0.3"
url = "2.3"
