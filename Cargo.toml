[package]
name = "citations"
version = "0.6.1"
authors = ["Maximiliano Sandoval <msandova@gnome.org>"]
edition = "2021"

[profile.release]
lto = true

[dependencies]
adw = { package = "libadwaita", version = "0.5", features = ["v1_4"] }
anyhow = "1.0"
async-std = "1.12"
cairo-rs = { version = "0.18", features = ["png"] }
cratebibtex = { path = "cratebibtex" }
futures-channel = "0.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gsv = { package = "sourceview5", version = "0.7" }
gtk = { version = "0.7", package = "gtk4", features = ["gnome_45"] }
log = "0.4"
once_cell = "1.12"
poppler-rs = { version = "0.22", features = ["v0_82"] }
sanitize-filename = "0.5"
surf = { version = "2.3", default-features = false, features = ["curl-client"] }
tracing-subscriber = "0.3"
url = "2.3"
