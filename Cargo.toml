[package]
name = "citations"
version = "0.4.0"
authors = ["Maximiliano Sandoval <msandova@gnome.org>"]
edition = "2021"

[dependencies]
adw = {package = "libadwaita", git = "https://gitlab.gnome.org/msandova/libadwaita-rs", branch = "adw-dialog-test", features = ["v1_2"] }
anyhow = "1.0"
async-std = "1.11"
cairo-rs = { version = "0.15", features = ["png"] }
cratebibtex = { path = "cratebibtex" }
futures-channel = "0.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gio = { version = "0.15", features = ["v2_72"] }
glib = { version = "0.15", features = ["v2_72"] }
gsv = { package = "sourceview5", version = "0.4" }
gtk = { version = "0.4", package = "gtk4", features = ["v4_6"] }
log = "0.4"
once_cell = "1.12"
poppler-rs = { version = "0.19", features = ["v0_82"] }
sanitize-filename = "0.4"
surf = "2.3"
tracing-subscriber = "0.3"
url = "2.2"
