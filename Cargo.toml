[workspace]
members = ["cratebibtex", "texer"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
authors = ["Maximiliano Sandoval <msandova@gnome.org>"]

[workspace.dependencies]
anyhow = "1"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
log = "0.4"
texer = { path = "texer" }

[package]
name = "citations"
version = "0.6.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[profile.release]
lto = true

[dependencies]
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_8"] }
anyhow.workspace = true
cairo-rs = { version = "0.21", features = ["png"] }
cratebibtex = { path = "cratebibtex" }
formatx = "0.2.4"
texer.workspace = true
doi2bib = "0.2"
futures-channel = "0.3"
gettext-rs.workspace = true
gsv = { package = "sourceview5", version = "0.10" }
gtk = { version = "0.10", package = "gtk4", features = ["gnome_47"] }
log.workspace = true
poppler-rs = { version = "0.25", features = ["v0_82"] }
reqwest = "0.12"
sanitize-filename = "0.6"
tokio = { version = "1.36", default-features = false, features = ["rt-multi-thread"] }
tracing-subscriber = "0.3"
url = "2.3"
