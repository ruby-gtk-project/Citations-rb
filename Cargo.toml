[package]
name = "citations"
version = "0.6.2"
authors = ["Maximiliano Sandoval <msandova@gnome.org>"]
edition = "2021"

[profile.release]
lto = true

[dependencies]
adw = { package = "libadwaita", version = "0.6", features = ["v1_5"] }
anyhow = "1.0"
cairo-rs = { version = "0.19", features = ["png"] }
cratebibtex = { path = "cratebibtex" }
doi2bib = "0.1.6"
futures-channel = "0.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gsv = { package = "sourceview5", version = "0.8" }
gtk = { version = "0.8", package = "gtk4", features = ["gnome_45"] }
log = "0.4"
once_cell = "1.12"
poppler-rs = { version = "0.23", features = ["v0_82"] }
sanitize-filename = "0.5"
surf = { version = "2.3", default-features = false, features = ["curl-client"] }
tokio = { version = "1.36.0", features = ["full"] }
tracing-subscriber = "0.3"
url = "2.3"
